<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연예인으로 살아가기</title>
<link rel="stylesheet" href="style.css?v=1794575350">
</head>
<body>
<div id="app">

  <!-- 첫 화면 -->
  <section id="title-screen" class="screen">
    <div class="title-wrap">
      <div class="title-kicker">KOREAN ENTERTAINMENT LIFE SIMULATION</div>
      <h1 class="title-main">연예인으로 살아가기</h1>
      <p class="title-sub">한국 어딘가에서 랜덤하게 태어나<br>엔터테인먼트 업계에서 살아가는 한 사람의 인생</p>
      <div class="title-btns">
        <button class="btn primary big" id="btn-new">새 인생 시작</button>
        <button class="btn big hidden" id="btn-continue">이어하기 <span id="continue-info" class="muted"></span></button>
        <button class="btn" id="btn-hall">지난 인생들</button>
        <button class="btn ghost" id="btn-import-title">세이브 파일 불러오기</button>
        <button class="btn ghost" id="btn-code-title">세이브 코드 붙여넣기</button>
      </div>
      <p class="title-note">진행 상황은 이 브라우저에 자동 저장됩니다. 메뉴에서 세이브 파일로 따로 보관할 수도 있어요.</p>
    </div>
  </section>

  <!-- 태어나기 -->
  <section id="birth-screen" class="screen hidden">
    <div class="birth-wrap">
      <div class="birth-head"><div class="kicker">탄생</div></div>
      <div id="birth-cards" class="bp"></div>
      <div class="birth-btns">
        <button class="btn big" id="btn-reroll">↻ 다시 태어나기</button>
        <button class="btn primary big" id="btn-born">이 인생으로 태어나기</button>
      </div>
    </div>
  </section>

  <!-- 게임 -->
  <section id="game-screen" class="screen hidden">
    <header id="topbar">
      <div class="who">
        <div class="who-name"><span id="t-name"></span> <span id="t-age" class="accent"></span></div>
        <div class="who-sub" id="t-stage"></div>
      </div>
      <!-- 날짜: 이름·나이와 메뉴 버튼 사이 한가운데, 위쪽 줄 높이에 맞춰 크게 -->
      <span id="t-date" class="date"></span>
      <nav class="top-btns">
        <button class="btn sm" data-panel="career">📚 백과사전</button>
        <button class="btn sm mob-only" id="btn-life" data-panel="life">🏠 생활</button>
        <button class="btn sm ghost" data-panel="menu">메뉴</button>
      </nav>
      <!-- 진행(창이 뜨거나 새 메시지가 오거나 6개월이 지날 때까지) · 오른쪽에 1달 후 (v185: 1년 후 버튼은 빼고 1달 후가 그 자리까지 채운다). 이 묶음 바로 아래가 일정 줄 (UI 개편 시안) -->
      <div class="turn-btns">
        <button class="btn primary turn-go" id="btn-go">진행 ▶ <kbd>Space</kbd></button>
        <div class="turn-jump">
          <button class="btn sm" id="btn-month">1달 후 <kbd>1</kbd></button>
        </div>
      </div>
    </header>
    <!-- 세 줄 (UI 개편 시안): 왼쪽 프로필 → 재정 · 상태 → 직업 활동 / 가운데 인간관계 → 메시지함 · 구직활동 · 활동 지원 · 에고서칭 → 생활 → 회사 / 오른쪽 일정 (진행 버튼 바로 아래) -->
    <!-- 왼쪽 줄과 가운데 줄은 따로 쌓는다. 맨 아래 박스(직업 활동 · 회사)가 남는 높이를 채운다 -->
    <main id="cols">
      <div class="col-l">
        <div id="profile-card" class="card"></div>
        <div class="duo ms-duo">
          <div id="money-card" class="card bn-card" data-moneycard></div>
          <div id="status-card" class="card"></div>
        </div>
        <div id="jobs-card" class="card"></div>
      </div>
      <div class="col-m">
        <div id="people-card" class="card bn-card" data-panel="people"></div>
        <div class="hub-btns">
          <button class="hub-bn" id="btn-inbox" data-panel="inbox">📨 메시지함</button>
          <button class="hub-bn" id="btn-applyjob" data-panel="applyjob">📝 구직활동</button>
          <button class="hub-bn" id="btn-applyact" data-panel="applyact">🎭 활동 지원</button>
          <button class="hub-bn hub-ego hidden" id="btn-ego" data-commnow>💬 에고서칭</button>
        </div>
        <div id="life-card" class="card">
          <div class="card-h">🏠 생활</div>
          <div id="life-grid" class="life-q"></div>
        </div>
        <div id="co-card" class="card"></div>
      </div>
      <aside id="sched-col">
        <div id="slots-card" class="card"></div>
      </aside>
    </main>
    <div id="ended-bar" class="ended-bar hidden">이 인생은 끝났습니다. <button class="btn sm primary" id="btn-ending">인생 결산 보기</button> <button class="btn sm" id="btn-newlife2">다시 태어나기</button></div>
  </section>

  <!-- 사건 창 -->
  <div id="modal" class="overlay hidden"><div class="mcard" id="mcard"></div></div>
  <!-- 곡 결과 카드 · 정산서 작은 창 (v118) -->
  <div id="pop" class="overlay pop-ov hidden"><div class="mcard pop-card" id="pop-card"></div></div>
  <!-- 실시간 창 (12-1): 무대 · 세트 · 방송. 결과에 이르는 과정을 보기만 한다 -->
  <div id="live" class="overlay live-ov hidden"><div class="mcard live-card" id="live-card"></div></div>

  <!-- 진로·인간관계 등 창 -->
  <div id="panel" class="overlay hidden"><div class="mcard sheet" id="pcard"></div></div>
  <!-- 확인 창 -->
  <div id="confirm" class="overlay hidden"><div class="mcard small" id="ccard"></div></div>
  <!-- 턴 진행: 화면이 어두워지고 가운데에 넘어가는 날짜, 멈추면 그 사이 있었던 일 요약 -->
  <div id="turn" class="overlay turn-dim hidden"><div class="mcard turn-card" id="tcard"></div></div>
  <div id="toast" class="toast"></div>
  <input type="file" id="file-input" accept=".json,application/json" class="hidden">
</div>
<script src="js/util.js?v=1794575350"></script>
<script src="js/data.js?v=1794575350"></script>

<script src="js/film.js?v=1794575350"></script>
<script src="js/scandal.js?v=1794575350"></script>
<script src="js/vidol.js?v=1794575350"></script>
<script src="js/mcn.js?v=1794575350"></script>
<script src="js/company.js?v=1794575350"></script>
<script src="js/studio.js?v=1794575350"></script>
<script src="js/concert.js?v=1794575350"></script>
<script src="js/dancer.js?v=1794575350"></script>
<script src="js/anime.js?v=1794575350"></script>
<script src="js/webnovel.js?v=1794575350"></script>
<script src="js/illust.js?v=1794575350"></script>
<script src="js/prof.js?v=1794575350"></script>

</body>
</html>
